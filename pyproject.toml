[project]
name = "hergbench"
version = "0.1.0"
description = "Actionable hERG benchmark: strong baselines, scaffold splits, counterfactual lead reports."
requires-python = ">=3.11"
dependencies = [
  "typer[all]>=0.12",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "optuna>=3.6",
  "matplotlib>=3.7",
  "plotly>=5.20",
  "tdc>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pre-commit>=3.7",
]

[project.scripts]
hergbench = "hergbench.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

