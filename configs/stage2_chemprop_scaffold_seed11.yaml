stage: 2
run_name: stage2_chemprop_dmnn__SPLIT__seed11

data:
  path: data/processed/herg_clean.csv
  smiles_col: smiles
  target_col: y
  sha256: null  # recommend pinning after first successful run

splits:
  membership_path: hERGBench_Stage1_SignOff_v2_triple_seed11/inputs/splits/scaffold_seed11.csv
  join_key: mol_id
  split_col: split

chemprop:
  task_type: classification
  metrics: [prc, roc]
  tracking_metric: prc
  epochs: 80
  patience: 10

  batch_size: 64
  num_workers: 4

  message_hidden_dim: 300
  depth: 3
  dropout: 0.0

  init_lr: 1.0e-4
  max_lr: 1.0e-3
  final_lr: 1.0e-4
  warmup_epochs: 2

  data_seed: 42
  pytorch_seed: 42
  accelerator: cpu
  devices: 1

calibration:
  enabled: true
  method: platt
  eps: 1.0e-6

evaluation:
  ad_bins: [0.3, 0.5, 0.7]

reporting:
  run_root: reports/runs
  save_preds: true
