# base configuration for reproducible runs.
project:
  project_name: "hergbench"
  run_name: "stage0_smoke_test"

repro:
  seed: 42

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_splits: "data/splits"
  reports_root: "reports"
  runs_root: "reports/runs"

logging:
  level: "INFO"

# # patch 0.1
stage1:
  dataset:
    tdc_task: "Tox"
    name: "hERG"
    smiles_col: "Drug"
    label_col: "Y"

  # we will implement our own Bemis–Murcko scaffold split
  # per protocol (types)
  # Tanimoto similarity cutoff for Butina
  splits:
    types: ["random", "scaffold", "cluster"]   
    frac_train: 0.80
    frac_val: 0.10
    frac_test: 0.10
    seeds: [11, 22, 33, 44, 55]
    butina_cutoff: 0.60        
    force_resplit: false

  # ECFP4.
  features:
    radius: 2
    n_bits: 2048

  # good default for class imbalance
  model:
    optuna_trials: 75
    objective: "aucpr"    
    direction: "maximize"
    early_stopping_rounds: 50
    max_estimators: 4000

  # method: or "sigmoid" (Platt)
  # threshold_metric: or "f1"
  calibration:
    method: "isotonic"     
    threshold_metric: "youden"  
    n_bins: 10

  # similarity-to-train bins
  eval:
    bootstrap_B: 2000
    bins: [0.3, 0.5, 0.7]  

  # nmols: how many to return per molecule
  # max_targets: number of molecules to generate lead reports for
  # high_risk_p or "high_risk"
  # selection: per protocol - perturb high-risk predictions
  counterfactuals:
    enable: true
    selection: "high_risk"     
    high_risk_p: 0.7
    safe_p: 0.3                # Tier-1 flip only; Tier-2/3 governed by delta_min thresholds
    exmol_preset: "medium"
    exmol_n_samples: 1800      # hard minimum 1500 to surface rare valid counterfactuals
    nmols: 5
    delta_min: 0.10            # risk-reduction floor (Tier 2)
    delta_min_tier3: 0.05      # risk-reduction floor (Tier 3)
    max_targets: 20
    relaxations: []            # optional single-constraint relaxations, each audited in reports
    constraints:
      min_tanimoto_flip: 0.5
      min_tanimoto_improve: 0.7
      sa_max: 4.5
      logp_delta_max: 1.5
      qed_min: 0.0
      pains: true





